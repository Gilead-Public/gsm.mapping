meta:
  Type: Mapped
  ID: IPNS
  Description: IP Non-Starter Status Mapping
  Priority: 2
spec:
  Mapped_SUBJ:
    studyid:
      type: character
    subjid:
      type: character
    invid:
      type: character
    country:
      type: character
    drv_enrollment_dt:
      type: Date
    drv_ip_dosed:
      type: character
    drv_ip_first_dose_dt:
      type: Date
    drv_enrl_first_dose_days:
      type: integer
    drv_days_lapsed_since_enrl:
      type: integer
    drv_ip_nonstarter_status:
      type: character
steps:
  # Isolated from SUBJ.yaml on purpose: a CASE over an absent column fails the
  # whole subject mapping, which would break every study without the upstream
  # derivation. Here the failure is confined to studies selecting IPNS.
  - output: Mapped_IPNS
    name: workr::RunQuery
    params:
      df: Mapped_SUBJ
      strQuery: >
        SELECT studyid, subjid, invid, country,
               drv_enrollment_dt, drv_ip_dosed, drv_ip_first_dose_dt,
               drv_enrl_first_dose_days, drv_days_lapsed_since_enrl,
               drv_ip_nonstarter_status,
               CASE drv_ip_nonstarter_status
                 WHEN 'Dosed'                                THEN 0
                 WHEN 'Potential Non-Starter within window'  THEN 1
                 WHEN 'Potential Non-Starter outside window' THEN 2
                 WHEN 'Confirmed Non-Starter'                THEN 3
               END AS ipns_status_ord
        FROM df

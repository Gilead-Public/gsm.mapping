meta:
  Type: Mapped
  ID: VS
  Description: Vital Signs Data Mapping
  Priority: 1
spec:
  Raw_VS:
    studyid:
      type: character
    invid:
      type: character
    country:
      type: character
    subjid:
      type: character
    visit:
      type: character
      source_col: foldername
    vs_dt:
      type: Date
    vsperf_std:
      type: character
    weight:
      type: numeric
    height:
      type: numeric
    bmi:
      type: numeric
    sysbp:
      type: numeric
    diabp:
      type: numeric
    pulse:
      type: numeric
    temp:
      type: numeric
    resp:
      type: numeric
    bsa:
      type: numeric
steps:
  # Sorting here makes downstream repeat-measure metrics reproducible: they
  # depend on the order of a subject's records, and raw extracts are unordered.
  # visit breaks same-date ties.
  - output: Mapped_VS
    name: workr::RunQuery
    params:
      df: Raw_VS
      strQuery: "SELECT * FROM df ORDER BY studyid, subjid, vs_dt, visit"

meta:
  Type: Mapped
  ID: VS
  Description: Vital Signs Data Mapping
  # Priority 2: depends on Mapped_SUBJ, which is produced at Priority 1.
  Priority: 2
spec:
  Raw_VS:
    studyid:
      type: character
    subjid:
      type: character
    visit:
      type: character
      source_col: foldername
    vs_dt:
      type: Date
    vsperf_std:
      type: character
    weight:
      type: numeric
    height:
      type: numeric
    bmi:
      type: numeric
    sysbp:
      type: numeric
    diabp:
      type: numeric
    pulse:
      type: numeric
    temp:
      type: numeric
    resp:
      type: numeric
    bsa:
      type: numeric
  Mapped_SUBJ:
    studyid:
      type: character
    subjid:
      type: character
    invid:
      type: character
    country:
      type: character
steps:
  # Merge [ invid, country ] onto EDC domains. Raw_VS carries its own invid,
  # but Mapped_SUBJ is the source of truth for site and country assignment.
  - output: Temp_SubjectLookup
    name: dplyr::select
    params:
      .data: Mapped_SUBJ
      studyid: studyid
      subjid: subjid
      invid: invid
      country: country
  - output: Temp_VS
    name: dplyr::left_join
    params:
      x: Raw_VS
      "y": Temp_SubjectLookup
      by:
        - studyid
        - subjid
  # Sorting here makes downstream repeat-measure metrics reproducible: they
  # depend on the order of a subject's records, and raw extracts are unordered.
  # visit breaks same-date ties.
  - output: Mapped_VS
    name: workr::RunQuery
    params:
      df: Temp_VS
      strQuery: "SELECT * FROM df ORDER BY studyid, subjid, vs_dt, visit"

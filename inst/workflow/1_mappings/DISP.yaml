meta:
  Type: Mapped
  ID: DISP
  Description: Study Disposition Data Mapping
  Priority: 2
spec:
  Raw_SUBJ:
    studyid:
      type: character
    subjid:
      type: character
    invid:
      type: character
    country:
      type: character
    enrollyn:
      type: character
    drv_study_disposition:
      type: character
    drv_last_contact_dt:
      type: Date
    drv_withdrawn_dt:
      type: Date
    drv_death_dt:
      type: Date
    drv_ae_death_dt:
      type: Date
    rbqm_flags:
      type: character
steps:
  - output: Mapped_DISP
    name: workr::RunQuery
    params:
      df: Raw_SUBJ
      strQuery: >
        SELECT studyid, subjid, invid, country, enrollyn,
               drv_study_disposition, drv_last_contact_dt,
               drv_withdrawn_dt, drv_death_dt, drv_ae_death_dt, rbqm_flags
        FROM df

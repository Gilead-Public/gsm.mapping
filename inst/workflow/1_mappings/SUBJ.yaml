meta:
  Type: Mapped
  ID: SUBJ
  Description: Subject Data Mapping
  Priority: 1
spec:
  Raw_SUBJ:
    studyid:
      type: character
    invid:
      type: character
    country:
      type: character
    subjid:
      type: character
    subject_nsv:
      type: character
    enrollyn:
      type: character
    timeonstudy:
      type: integer
    firstparticipantdate:
      type: Date
    firstdosedate:
      type: Date
    timeontreatment:
      type: integer
    drv_enrollment_dt:
      type: Date
    drv_ip_dosed:
      type: character
    drv_ip_first_dose_dt:
      type: Date
    drv_enrl_first_dose_days:
      type: integer
    drv_days_lapsed_since_enrl:
      type: integer
    drv_ip_nonstarter_status:
      type: character
    agerep:
      type: integer
    sex:
      type: character
    race:
      type: character
    mincreated_dts:
      type: timestamp
steps:
  - output: Mapped_SUBJ
    name: workr::RunQuery
    params:
      df: Raw_SUBJ
      strQuery: "SELECT * FROM df WHERE enrollyn == 'Y'"
